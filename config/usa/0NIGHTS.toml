# Main program (1st Read file). Load address comes from IP.BIN.
name = "0NIGHTS"
region = "usa"
image = "extracted/usa/files/0NIGHTS"
vram = 0x06004000
sha1 = "08faf86952b8f68ddd7b212ab297ab815c6b8067"
symbols = "symbols.txt"
equates = ["include/saturn.inc"]

# RAM outside the image that the program refers to: BSS, heap and overlay space
# in High and Low Work RAM. References become linked symbols.
extern_ranges = [
    [0x06004000, 0x06100000],
    [0x00200000, 0x00300000],
]

# Translation units (start address + name), proposed by `split.py --units` and
# then edited by hand as module boundaries are worked out.
units = "units.txt"

# Progress categories shown on bytematch. A unit belongs to the category named by
# its prefix (game/, sbl/, shclib/); `start` is used when proposing new units.
[[category]]
id = "game"
name = "Game (assembly)"
start = 0x06004000

[[category]]
id = "sbl"
name = "SBL library (C)"
start = 0x06067300

[[category]]
id = "shclib"
name = "Hitachi C runtime"
start = 0x06050674
